$schema: https://uniform.app/schemas/json-schema/component-definition/v1.json
id: trailList
name: Trail List
icon: screen
parameters:
  - id: heading
    name: Heading
    type: text
    typeConfig:
      required: true
    localizable: true
  - id: subheading
    name: Subheading
    type: text
    guidance: One short sentence introducing the list of hiking trails.
    localizable: true
  - id: trailSystems
    name: Trail Systems Data
    type: json
    guidance: >-
      Do not type here. Connect this to the Trail systems data resource so it
      receives the list of trail systems.
