composition:
  _name: Card Grid Pattern
  _id: 966f0496-1e99-443e-a1fa-35cdf54aacef
  type: cardGrid
  parameters:
    columns:
      type: select
      value: '3'
    heading:
      type: text
      locales:
        en-US: Latest News and Views
    sectionId:
      type: text
      value: topics
    background:
      type: select
      value: subtle
    showDivider:
      type: checkbox
      value: false
    headingAlign:
      type: select
      value: center
    containerWidth:
      type: select
      value: default
  slots:
    cards:
      - _id: 918ff0af-7dc9-4708-a0b6-9b44e412647f
        type: $loop
        slots:
          body:
            - _id: 31fb3838-331e-424c-b6f2-ffd9f1ba6cf7
              type: linkCard
              parameters:
                link:
                  type: link
                  locales:
                    en-US:
                      path: >-
                        /${locale}/articles/${#jptr:/Article List Content
                        entries Loop Item/entry/_slug}
                      type: projectMapNode
                      nodeId: cc96d630-71db-49ca-884b-c458575e1758
                      projectMapId: 82aca4d7-61fa-4e5a-b6e5-a36ad6de83ad
                      dynamicInputValues:
                        locale: ${locale}
                        article-url: >-
                          ${#jptr:/Article List Content entries Loop
                          Item/entry/_slug}
                image:
                  type: asset
                  value: >-
                    ${#jptr:/Article List Content entries Loop
                    Item/entry/fields/image/value}
                title:
                  type: text
                  locales:
                    en-US: >-
                      ${#jptr:/Article List Content entries Loop
                      Item/entry/fields/title/value}
                showArrow:
                  type: checkbox
                  value: false
                imageRatio:
                  type: select
                  value: standard
                description:
                  type: text
                  locales:
                    en-US: >-
                      ${#jptr:/Article List Content entries Loop
                      Item/entry/fields/subtitle/value}
                hoverEffect:
                  type: select
                  value: zoom
                showDescription:
                  type: checkbox
                  value: true
        _dataResources:
          Article List Content entries Loop Item:
            type: sys-reserved-loop
            variables:
              connectedData: '#jptr:/Article List Content/entries:fa=c'
        _overridability:
          hideLockedParameters: true
  _dataResources:
    Article List Content:
      type: articleList
      variables:
        locale: ${locale}
        filters: '{"type[eq]":"article"}'
        contentTypes: article
      isPatternParameter: true
      ignorePatternParameterDefault: true
  _overridability:
    parameters:
      $viz: 'no'
      link: 'yes'
      columns: 'no'
      eyebrow: 'yes'
      heading: 'yes'
      linkText: 'yes'
      sectionId: 'no'
      background: 'yes'
      subheading: 'yes'
      showDivider: 'no'
      headingAlign: 'no'
      containerWidth: 'no'
  _locales:
    - en-US
