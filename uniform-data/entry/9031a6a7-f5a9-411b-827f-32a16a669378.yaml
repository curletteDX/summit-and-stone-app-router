    content:
      type: richText
      locales:
        en-US:
          root:
            type: root
            version: 1
            children:
              - type: paragraph
                version: 1
                children:
                  - text: >-
                      A sunrise hike in Mount Rainier National Park can be a
                      memorable way to experience alpine meadows, glaciers, and
                      first light on the mountain. With an early start and a
                      flexible plan, day hikers of many experience levels can
                      enjoy the morning safely. Before departing, check current
                      National Park Service trail, road, weather, and permit
                      information.
                    type: text
                    format: 0
                    version: 1
              - tag: h2
                type: heading
                version: 1
                children:
                  - text: Choose the right trail and check conditions
                    type: text
                    format: 0
                    version: 1
              - type: paragraph
                version: 1
                children:
                  - text: >-
                      Select a day hike that matches your group’s fitness,
                      experience, and the time available before daylight.
                      Popular areas such as Sunrise and Paradise offer scenic
                      options, but seasonal road openings, snow, wildlife
                      activity, and trail closures can change plans quickly.
                      Review the route in advance, download or carry a map, and
                      confirm current National Park Service trail, road,
                      weather, and permit information before you leave.
                    type: text
                    format: 0
                    version: 1
              - tag: h2
                type: heading
                version: 1
                children:
                  - text: Pack for changing alpine weather
                    type: text
                    format: 0
                    version: 1
              - type: paragraph
                version: 1
                children:
                  - text: >-
                      Mount Rainier’s weather can shift fast, even on a clear
                      summer morning. Temperatures are often much cooler before
                      sunrise, and wind, fog, rain, or lingering snow can make
                      exposed trails feel more demanding. Bring enough food,
                      water, and warm layers to stay comfortable if your pace
                      slows or you decide to turn around.
                    type: text
                    format: 0
                    version: 1
              - tag: ul
                type: list
                start: 1
                version: 1
                children:
                  - type: listitem
                    value: 1
                    version: 1
                    children:
                      - text: Headlamp with fresh batteries
                        type: text
                        format: 0
                        version: 1
                  - type: listitem
                    value: 2
                    version: 1
                    children:
                      - text: Warm insulating layer and waterproof, windproof shell
                        type: text
                        format: 0
                        version: 1
                  - type: listitem
                    value: 3
                    version: 1
                    children:
                      - text: Hat, gloves, water, and high-energy snacks
                        type: text
                        format: 0
                        version: 1
                  - type: listitem
                    value: 4
                    version: 1
                    children:
                      - text: Map, charged phone, and basic first-aid supplies
                        type: text
                        format: 0
                        version: 1
                listType: bullet
              - type: quote
                version: 1
                children:
                  - type: paragraph
                    version: 1
                    children:
                      - text: >-
                          Stay on marked trails, turn back when conditions
                          worsen, and make getting everyone home safely the
                          priority.
                        type: text
                        format: 2
                        version: 1
                    textFormat: 2
              - tag: h2
                type: heading
                version: 1
                children:
                  - text: Start early and respect the mountain
                    type: text
                    format: 0
                    version: 1
              - type: paragraph
                version: 1
                children:
                  - text: >-
                      Plan to arrive at the trailhead with time to park,
                      prepare, and begin walking before first light. Tell
                      someone your route and expected return time, keep your
                      group together, and leave no trace as you enjoy the
                      sunrise. This is a day-hiking adventure in the national
                      park, not a summit attempt: respect the terrain, give
                      wildlife space, and choose a turnaround time that leaves
                      plenty of daylight for the return.
                    type: text
                    format: 0
                    version: 1
